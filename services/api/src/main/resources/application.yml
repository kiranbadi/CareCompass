spring:
  application:
    name: carebridge-api
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/carebridge}
    username: ${DB_USERNAME:carebridge}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jackson:
    property-naming-strategy: SNAKE_CASE
  flyway:
    enabled: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
  tomcat:
    max-http-form-post-size: 16KB
auth:
  jwt-secret: VGhpcy1Jcy1BLURlbW8tSldULVNlY3JldC0zMkJ5dGVzISE=
  issuer: carebridge-api
  audience: carebridge-web
  cookie-secure: true
  access-ttl: 15m
  refresh-ttl: 7d
  lock-duration: 15m
  max-failed-attempts: 5
  rate-limit: 30
  bcrypt-strength: 12
logging:
  level:
    org.springframework.security: WARN
